<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>测测你的内在天赋</title>
<style>
:root{
  --bg:#F0F7FA;            /* 页面底色 */
  --mist:#C7E4EC;          /* 雾蓝 */
  --ink:#6D7795;           /* 主文字 / 按钮 */
  --lilac:#D8C8E8;         /* 淡紫 */
  --mint:#A9D6CF;          /* 薄荷 */
  --ink-deep:#4a5270;
  --card:#ffffff;
  --radius:20px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);
  background:linear-gradient(160deg,var(--bg) 0%,#e7f0f5 60%,var(--mist) 130%);
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:20px;
  -webkit-font-smoothing:antialiased;
}
.app{
  width:100%;max-width:560px;min-height:640px;
  /* 移动端铺满视口高度；桌面端限制在 900px 内 */
  height:calc(100vh - 40px);max-height:900px;
  background:var(--card);
  border-radius:32px;
  box-shadow:0 20px 60px rgba(109,119,149,.18);
  padding:36px 30px 32px;
  display:flex;flex-direction:column;
  position:relative;overflow-x:hidden;overflow-y:auto;
}
.app::before,.app::after{
  content:'';position:absolute;border-radius:50%;pointer-events:none;
}
.app::before{width:220px;height:220px;background:var(--mist);opacity:.35;top:-90px;right:-70px}
.app::after{width:260px;height:260px;background:var(--lilac);opacity:.30;bottom:-110px;left:-90px}

/* 页面切换 */
.page{display:none;flex:1;flex-direction:column;position:relative;z-index:1}
.page.show{display:flex;animation:in .4s ease}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- 封面 ---------- */
.cover{text-align:center;justify-content:flex-start}
.cover > *{flex:none}
.cover .kicker{
  display:inline-block;font-size:13px;letter-spacing:.35em;
  margin-top:27%;margin-bottom:18px;
  padding:6px 18px;border:1.5px solid var(--mist);border-radius:99px;
  align-self:center;color:var(--ink);opacity:.75;
}
.cover h1{
  font-size:2.3rem;font-weight:800;line-height:1.25;
  color:var(--ink-deep);letter-spacing:2px;margin-bottom:14px;
}
.cover h1 .hl{
  background:linear-gradient(120deg,var(--lilac),var(--mint));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.cover .sub{font-size:15px;color:var(--ink);opacity:.85;line-height:1.7;margin-bottom:8px}
.cover .intro{
  font-size:14px;color:var(--ink);opacity:.78;letter-spacing:.5px;
  line-height:1.6;align-self:center;max-width:300px;margin-top:2px;
}
.cover .dots{display:flex;gap:8px;justify-content:center;margin:26px 0 8px}
.cover .dots i{width:12px;height:12px;border-radius:50%}
.cover .dots i:nth-child(1){background:var(--mist)}
.cover .dots i:nth-child(2){background:var(--lilac)}
.cover .dots i:nth-child(3){background:var(--mint)}
.cover .dots i:nth-child(4){background:var(--ink);opacity:.35}
.btn{
  font-family:inherit;border:none;cursor:pointer;
  background:var(--ink);color:#fff;
  font-size:17px;font-weight:700;letter-spacing:6px;
  padding:16px 54px;border-radius:99px;
  box-shadow:0 10px 24px rgba(109,119,149,.35);
  transition:transform .18s,box-shadow .18s;
}
.btn:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(109,119,149,.45)}
.start-wrap{margin-top:auto;margin-bottom:18px;display:flex;justify-content:center}
.cover .hint{font-size:12px;color:var(--ink);opacity:.6;margin:14px 0 125px;text-align:center}

/* ---------- 答题页 ---------- */
.q-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.q-count{font-size:13px;color:var(--ink);opacity:.7;letter-spacing:.1em}
.q-group{font-size:12px;color:#fff;background:var(--ink);opacity:.9;border-radius:99px;padding:3px 12px;letter-spacing:.15em}
.track{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;margin-bottom:26px}
.track span{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--mist),var(--lilac),var(--mint));
  transition:width .35s ease}
.q-title{font-size:1.2rem;font-weight:700;color:var(--ink-deep);line-height:1.6;margin-bottom:22px}
.opts{display:grid;gap:12px}
.opt{
  font-family:inherit;font-size:15px;line-height:1.55;text-align:left;
  border:2px solid var(--mist);background:#fff;color:var(--ink);
  border-radius:16px;padding:14px 16px 14px 14px;cursor:pointer;
  display:flex;gap:12px;align-items:flex-start;width:100%;
  transition:border-color .15s,background .15s,transform .15s;
}
.opt:hover{border-color:var(--ink);transform:translateX(3px)}
.opt .key{
  flex:none;width:26px;height:26px;border-radius:50%;
  border:2px solid var(--mist);display:grid;place-items:center;
  font-size:13px;font-weight:700;color:var(--ink);margin-top:1px;
}
.opt:nth-child(1) .key{border-color:var(--mist);color:var(--ink)}
.opt:nth-child(2) .key{border-color:var(--lilac);color:var(--ink-deep)}
.opt:nth-child(3) .key{border-color:var(--mint);color:var(--ink-deep)}
.opt:nth-child(4) .key{border-color:var(--ink);color:var(--ink-deep)}
.opt.sel{border-color:var(--ink);background:var(--bg);font-weight:600}
.opt.sel .key{background:var(--ink);border-color:var(--ink);color:#fff}
.q-nav{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:18px}
.link-btn{
  font-family:inherit;background:none;border:none;cursor:pointer;
  color:var(--ink);opacity:.7;font-size:14px;padding:8px 4px;
}
.link-btn:hover{opacity:1}
.link-btn:disabled{opacity:.25;cursor:not-allowed}

/* ---------- 结果页 ---------- */
.result-top{text-align:center;margin-bottom:8px}
.result-top .r-kicker{font-size:12px;letter-spacing:.3em;opacity:.7;margin-bottom:10px;display:block}
.animal-big svg{width:74px;height:74px;display:block}
.m-grid button .em svg{width:26px;height:26px;display:block;margin:0 auto}
.animal-big{
  width:120px;height:120px;margin:0 auto 14px;border-radius:36px;
  background:linear-gradient(145deg,var(--mist),var(--lilac));
  display:grid;place-items:center;font-size:56px;
  box-shadow:0 12px 26px rgba(109,119,149,.25);
}
.r-name{font-size:1.9rem;font-weight:800;color:var(--ink-deep);letter-spacing:2px}
.r-code{font-size:13px;letter-spacing:.2em;opacity:.65;margin-top:4px}
.r-foot{font-size:14px;font-style:normal;color:var(--ink);opacity:.9;margin-top:6px}
.r-block{background:var(--bg);border-radius:18px;padding:16px 18px;margin-top:14px}
.r-block h3{font-size:14px;color:var(--ink-deep);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.r-block h3::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--mint)}
.r-block.c2 h3::before{background:var(--lilac)}
.r-block p,.r-block li{font-size:14px;line-height:1.75;color:var(--ink)}
.r-block ul{list-style:none}
.r-block li{padding-left:4px;margin-bottom:7px}
.r-block li b{color:var(--ink-deep)}
.r-dims{display:flex;gap:8px;margin-top:14px}
.r-dims .d{flex:1;background:var(--bg);border-radius:14px;padding:10px 8px;text-align:center}
.r-dims .d b{display:block;font-size:15px;color:var(--ink-deep)}
.r-dims .d span{font-size:11px;opacity:.7}
.r-dims .d .bar{height:5px;background:#e4e9f0;border-radius:99px;margin-top:6px;overflow:hidden}
.r-dims .d .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--mint),var(--lilac))}
.matrix{margin-top:18px}
.matrix h3{font-size:13px;text-align:center;letter-spacing:.2em;opacity:.75;margin-bottom:12px}
.m-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media(max-width:420px){.m-grid{grid-template-columns:repeat(4,1fr)}}
.m-grid button{
  font-family:inherit;border:2px solid transparent;background:var(--bg);
  border-radius:14px;padding:8px 2px 6px;cursor:pointer;text-align:center;
  transition:transform .15s,border-color .15s;
}
.m-grid button:hover{transform:translateY(-3px)}
.m-grid button.cur{border-color:var(--ink);background:#fff}
.m-grid button .em{font-size:22px;display:block}
.m-grid button .lb{font-size:9px;color:var(--ink);opacity:.75;margin-top:2px;display:block}
.r-actions{display:flex;gap:10px;justify-content:center;margin-top:16px}
.btn.small{font-size:14px;letter-spacing:2px;padding:11px 26px;box-shadow:0 8px 18px rgba(109,119,149,.3)}
.btn.ghosty{background:#fff;color:var(--ink);border:2px solid var(--mist);box-shadow:none}
.toast{
  position:fixed;left:50%;bottom:30px;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:9px 18px;border-radius:99px;
  font-size:13px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;
}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="app">

  <!-- 封面 -->
  <section class="page cover show" id="p-cover">
    <span class="kicker">INNER TALENT</span>
    <h1>测测你的<br><span class="hl">内在天赋</span></h1>
    <p class="intro">16 题，测出你天生擅长的那件事</p>
    <div class="dots"><i></i><i></i><i></i><i></i></div>
    <div class="start-wrap">
      <button class="btn" id="startBtn">开始测试</button>
    </div>
    <p class="hint">凭第一反应作答 · 约 2 分钟</p>
  </section>

  <!-- 题目页（JS 注入） -->
  <section class="page" id="p-quiz">
    <div class="q-top">
      <span class="q-count" id="qCount">Q 01 / 16</span>
      <span class="q-group" id="qGroup">上班日常</span>
    </div>
    <div class="track"><span id="qBar"></span></div>
    <h2 class="q-title" id="qTitle">题目</h2>
    <div class="opts" id="qOpts"></div>
    <div class="q-nav">
      <button class="link-btn" id="prevBtn">← 上一题</button>
      <button class="link-btn" id="quitBtn">回到首页</button>
    </div>
  </section>

  <!-- 结果页 -->
  <section class="page" id="p-result">
    <div class="result-top">
      <span class="r-kicker">YOUR INNER TALENT</span>
      <div class="animal-big" id="rEmoji">🦅</div>
      <div class="r-name" id="rName">—</div>
      <div class="r-code" id="rCode">—</div>
      <em class="r-foot" id="rFoot">—</em>
    </div>

    <div class="r-block">
      <h3>你的天赋表现在</h3>
      <p id="rDesc">—</p>
    </div>

    <div class="r-dims" id="rDims"></div>

    <div class="r-block c2">
      <h3>高匹配职业方向</h3>
      <ul id="rJobs"></ul>
    </div>

    <div class="r-block">
      <h3>天赋之痛</h3>
      <p id="rPain">—</p>
    </div>

    <div class="r-block c2">
      <h3>七天可以试一步</h3>
      <p id="rAct">—</p>
    </div>

    <div class="r-block">
      <h3>请避开</h3>
      <p id="rAvoid">—</p>
    </div>

    <div class="matrix">
      <h3>全 部 12 只 天 赋 兽</h3>
      <div class="m-grid" id="mGrid"></div>
    </div>

    <div class="r-actions">
      <button class="btn ghosty small" id="againBtn">再测一次</button>
      <button class="btn small" id="shareBtn">复制结果</button>
    </div>
  </section>

</div>
<div class="toast" id="toast"></div>

<script>
/* ============ 题库：A=O 秩序力  B=I 洞察力  C=C 连接力  D=M 创造力 ============ */
const GROUPS=['上班日常','烧心的情况','同事间的"故事"','自我评价环节'];
const QUESTIONS=[
 {g:0,q:'早上 8:59 匆匆打卡，9:00 要开会。你要做的第一件事是——',o:[
  ['坐上工位，会议链接早就挂在收藏夹里','O'],
  ['先扫一眼小群，看谁还没到','I'],
  ['和同事说一声"我打份资料，可能晚两分钟"','C'],
  ['不开摄像头，边听边做其他工作','M']]},
 {g:0,q:'收到一份表格/文档，第一眼你会看——',o:[
  ['格式和数据是否正确，有无语病','O'],
  ['方案的逻辑是否可行','I'],
  ['写方案的同事怀着什么样的心情','C'],
  ['要是我来重做这个，会做成什么样','M']]},
 {g:0,q:'朋友发来一句"在吗"，你心里第一反应是——',o:[
  ['难道要让我帮什么忙','O'],
  ['等 ta 发完','I'],
  ['ta 遇到了什么紧急情况','C'],
  ['我先发个表情包（直接耍起）','M']]},
 {g:0,q:'刷到一条爆火的 AI 短剧，你会想——',o:[
  ['这短剧不烧心，前三秒抓人、中间给爽点','O'],
  ['这个选题精准打中了哪一群人','I'],
  ['评论区的人都在共情什么','C'],
  ['我能不能做个更好的版本','M']]},
 {g:1,q:'下班前被领导打回，要改第三版，你的第一反应是——',o:[
  ['自己复盘一下再改','O'],
  ['问领导"为什么""改什么"，搞清楚再动手','I'],
  ['先安抚一下领导情绪','C'],
  ['溜之大吉，工作明天见','M']]},
 {g:1,q:'项目卡住了，组员们在群里踢皮球。你作为组长会——',o:[
  ['直接@全体成员：A 负责 X、B 负责 Y，今晚 8 点对一次','O'],
  ['弱弱地问一句：我们是不是从一开始就搞错了目标……','I'],
  ['私聊群里吵最凶的人，把 ta 情绪稳定好','C'],
  ['把方案自己先做一版扔进去，让大家有个东西可吵','M']]},
 {g:1,q:'最能让你感觉"这班没白上"的瞬间是——',o:[
  ['工作在你手中顺利完成','O'],
  ['工作让你 get 新技能','I'],
  ['领导跟你说"还好有你在"','C'],
  ['发薪日到账瞬间','M']]},
 {g:1,q:'你最受不了的职场情景是——',o:[
  ['饭都没吃，开会两小时，结论是"下次再议"','O'],
  ['领导方向错了，没人敢说','I'],
  ['组里有阴阳人，气氛搞得很难受','C'],
  ['一堆流程卡着等审批，什么都做不出来','M']]},
 {g:2,q:'同事被领导当众批了一顿，散会后你会——',o:[
  ['帮 ta 把被否的东西重做','O'],
  ['和稀泥：领导肯定不是这个意思，没事的','I'],
  ['什么都不说，先陪 ta 抽根烟 / 喝杯奶茶','C'],
  ['笑幻 ta（感觉会被 ta 打死）','M']]},
 {g:2,q:'同事们给你的封号是——',o:[
  ['靠谱的家长','O'],
  ['眼光毒辣，说话犀利','I'],
  ['老好人','C'],
  ['nb / 乐子人','M']]},
 {g:2,q:'群里突然冷场了，你会——',o:[
  ['把话题拽回正事','O'],
  ['把刚才没人接的那句话挑出来，重新问一遍','I'],
  ['发个表情包，缓和气氛','C'],
  ['甩一个新话题或一张图，重新起头','M']]},
 {g:2,q:'你希望在团队里真正的作用是——',o:[
  ['做团队的计划表，保证进度稳稳推进','O'],
  ['把握团队的大方向','I'],
  ['让所有人开心','C'],
  ['让创新的想法落地，做一些有趣的新东西','M']]},
 {g:3,q:'周末过完，你觉得"这周回血了"，通常是因为——',o:[
  ['房间收拾干净了，待办清空了','O'],
  ['看完了想看的书 / 想通了一件心事','I'],
  ['跟朋友聊了很久，聊开了','C'],
  ['让想法和尝试落地了','M']]},
 {g:3,q:'最让你破防的是——',o:[
  ['计划全被打乱，一切都要重来','O'],
  ['周围没人愿意动脑，只要一个答案','I'],
  ['一群不熟的人，还要一直陪着笑','C'],
  ['天天干重复的活，一点新东西都没有','M']]},
 {g:3,q:'别人说你"太——"的时候，大概率是哪个词？',o:[
  ['太较真','O'],
  ['想太多','I'],
  ['太敏感','C'],
  ['太不切实际','M']]},
 {g:3,q:'如果周一不用上班、也没人管你，你大概会——',o:[
  ['收拾家里，在整洁的沙发上看电视','O'],
  ['因为想知道野外的鸟怎么磨嘴，搜了一下午','I'],
  ['约老朋友聊天喝下午茶','C'],
  ['做一件痛快的事，出去玩个够（又是大耍起哈哈哈）','M']]}

/* ============ 12 只天赋兽 · 手绘 SVG 图标 ============ */

 /* 蜘蛛：圆身 + 八条折腿 + 两只大眼 */

 /* 喜鹊：圆身 + 白肚 + 长尾 + 粉喙 */

const $=s=>document.querySelector(s);
let idx=0;
const answers=new Array(QUESTIONS.length).fill(null);
const pages={cover:$('#p-cover'),quiz:$('#p-quiz'),result:$('#p-result')};
let current='cover';

function show(name){
  Object.values(pages).forEach(p=>p.classList.remove('show'));
  pages[name].classList.add('show');
  current=name;
}
function renderQ(){
  const q=QUESTIONS[idx];
  $('#qCount').textContent='Q '+String(idx+1).padStart(2,'0')+' / '+QUESTIONS.length;
  $('#qGroup').textContent=GROUPS[q.g];
  $('#qBar').style.width=(idx/QUESTIONS.length*100)+'%';
  $('#qTitle').textContent=q.q;
  const box=$('#qOpts');box.innerHTML='';
  q.o.forEach((o,i)=>{
    const b=document.createElement('button');
    b.type='button';b.className='opt'+(answers[idx]===i?' sel':'');
    b.innerHTML=`<span class="key">${'ABCD'[i]}</span><span>${o[0]}</span>`;
    b.onclick=()=>{answers[idx]=i;
      [...box.children].forEach((el,k)=>el.classList.toggle('sel',k===i));
      setTimeout(next,220);};
    box.appendChild(b);
  });
  $('#prevBtn').disabled=idx===0;
}
function next(){
  if(idx<QUESTIONS.length-1){idx++;renderQ();}
  else finish();
}
function finish(){
  const s={O:0,I:0,C:0,M:0};
  answers.forEach((ai,qi)=>{if(ai!==null)s[QUESTIONS[qi].o[ai][1]]++;});
  const sorted=Object.entries(s).sort((a,b)=>b[1]-a[1]);
  const code=sorted[0][0]+ '+' +sorted[1][0];
  const r=RESULTS[code]||RESULTS[ORDER[0]];
  $('#rEmoji').innerHTML=ICON(code);
  $('#rName').textContent=r.name;
  $('#rCode').textContent='主天赋 '+sorted[0][0]+' · 副天赋 '+sorted[1][0];
  $('#rFoot').textContent=r.foot;
  $('#rDesc').textContent=r.desc;
  $('#rJobs').innerHTML=r.jobs.map(j=>`<li><b>${j[0]}</b> —— ${j[1]}</li>`).join('');
  $('#rPain').textContent=r.pain;
  $('#rAct').textContent=r.act;
  $('#rAvoid').textContent=r.avoid;
  const max=Math.max(...Object.values(s),1);
  $('#rDims').innerHTML=Object.entries(s).map(([k,v])=>`
    <div class="d"><b>${k}</b><span>${DIM_LABEL[k]}</span>
    <div class="bar"><i style="width:${Math.round(v/max*100)}%"></i></div></div>`).join('');
  renderMatrix(code);
  show('result');
  history.replaceState(null,'','#'+code);
}
function renderMatrix(cur){
  $('#mGrid').innerHTML=ORDER.map(c=>`

    </button>`).join('');
}

  $('#rAct').textContent=r.act;
  $('#rAvoid').textContent=r.avoid;
  $('#rDims').innerHTML='<div class="d" style="grid-column:1/-1;font-size:13px;opacity:.75">点击底部矩阵查看其他天赋兽 · 完整四维分布需本人完成测试</div>';
  [...$('#mGrid').children].forEach(b=>b.classList.toggle('cur',b.dataset.c===code));
  history.replaceState(null,'','#'+code);
}

/* ============ 事件 ============ */
$('#startBtn').onclick=()=>{idx=0;answers.fill(null);renderQ();show('quiz');};
$('#prevBtn').onclick=()=>{if(idx>0){idx--;renderQ();}};
$('#quitBtn').onclick=()=>show('cover');
$('#againBtn').onclick=()=>{idx=0;answers.fill(null);renderQ();show('quiz');};
$('#shareBtn').onclick=()=>{
  const txt=`我的内在天赋是【${$('#rName').textContent}】${$('#rFoot').textContent}`;
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject())
    .then(()=>toast('结果已复制，快去分享吧'))
    .catch(()=>toast(txt));
};
let tT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),1800);}
document.addEventListener('keydown',e=>{
  if(current!=='quiz')return;
  if(['1','2','3','4'].includes(e.key)){const i=+e.key-1;
    if($('#qOpts').children[i])$('#qOpts').children[i].click();}
});

/* 从矩阵链接直达 */
(function(){
  const h=(location.hash||'').replace('#','').toUpperCase();
  if(RESULTS[h]){idx=0;answers.fill(null);renderMatrix(h);paintShared(h);show('result');}
})();
</script>
</body>
</html>
